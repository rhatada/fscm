# App of Apps Pattern
# This template generates ArgoCD Applications for each enabled component

{{- if .Values.components.mta-operator.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-mta-operator
  namespace: {{ .Values.argocd.namespace }}
  labels:
    demo.redhat.com/application: "field-content"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.gitops.repoUrl }}
    targetRevision: {{ .Values.gitops.revision }}
    path: {{ .Values.gitops.basePath }}/components/operator
    helm:
      valuesObject:
        operator:
          enabled: {{ .Values.components.mta-operator.enabled }}
          name: {{ .Values.components.mta-operator.name }}
          namespace: {{ .Values.components.mta-operator.namespace }}
          channel: {{ .Values.components.mta-operator.channel }}
          source: {{ .Values.components.mta-operator.source }}
          sourceNamespace: {{ .Values.components.mta-operator.sourceNamespace }}
          installPlanApproval: {{ .Values.components.mta-operator.installPlanApproval }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.components.mta-operator.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}

