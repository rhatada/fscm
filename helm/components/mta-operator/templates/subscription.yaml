{{- if .Values.mta-operator.enabled }}
{{- $existingSub := lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.mta-operator.namespace .Values.mta-operator.name }}
{{- if not $existingSub.metadata }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.mta-operator.name }}
  namespace: {{ .Values.mta-operator.namespace }}
  labels:
    demo.redhat.com/application: "mta-operator"
spec:
  channel: {{ .Values.mta-operator.channel }}
  installPlanApproval: {{ .Values.mta-operator.installPlanApproval }}
  name: {{ .Values.mta-operator.name }}
  source: {{ .Values.mta-operator.source }}
  sourceNamespace: {{ .Values.mta-operator.sourceNamespace }}
{{- end }}
{{- end }}
