{{- if .Values.cloudnative-pg.enabled }}
{{- $existingSub := lookup "operators.coreos.com/v1alpha1" "Subscription" .Values.cloudnative-pg.namespace .Values.cloudnative-pg.name }}
{{- if not $existingSub.metadata }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.cloudnative-pg.name }}
  namespace: {{ .Values.cloudnative-pg.namespace }}
  labels:
    demo.redhat.com/application: "cloudnative-pg"
spec:
  channel: {{ .Values.cloudnative-pg.channel }}
  installPlanApproval: {{ .Values.cloudnative-pg.installPlanApproval }}
  name: {{ .Values.cloudnative-pg.name }}
  source: {{ .Values.cloudnative-pg.source }}
  sourceNamespace: {{ .Values.cloudnative-pg.sourceNamespace }}
{{- end }}
{{- end }}
